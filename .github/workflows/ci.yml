name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Lock files are committed; fail if they drift from the project files.
      - name: Restore dependencies
        run: dotnet restore Cmux.sln --locked-mode

      - name: Build
        run: dotnet build Cmux.sln --no-restore --configuration ${{ matrix.configuration }}

      - name: Test
        run: dotnet test tests/Cmux.Tests --no-build --configuration ${{ matrix.configuration }} --verbosity normal

      - name: Fail on vulnerable packages
        shell: pwsh
        run: |
          $output = dotnet list Cmux.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -or $output -match 'has the following vulnerable packages') {
            Write-Error 'Vulnerable packages found (see the list above).'
            exit 1
          }

  publish:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # RID-specific restore updates the lock files, so this job is not run in locked mode.
      - name: Publish app, session daemon and CLI into one folder
        shell: pwsh
        run: |
          $out = 'publish/app'
          dotnet publish src/Cmux/Cmux.csproj -c Release -r win-x64 --self-contained -o $out
          dotnet publish src/Cmux.Daemon/Cmux.Daemon.csproj -c Release -r win-x64 --self-contained -o $out
          dotnet publish src/Cmux.Cli/Cmux.Cli.csproj -c Release -r win-x64 --self-contained -o $out

      - name: Package zip and SHA256
        shell: pwsh
        run: |
          $version = dotnet msbuild src/Cmux/Cmux.csproj -nologo -getProperty:Version
          $zip = "cmux-windows-$version-win-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'publish/app/*' -DestinationPath "dist/$zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$zip").Hash.ToLowerInvariant()
          Set-Content -Path "dist/$zip.sha256" -Value "$hash  $zip" -NoNewline
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cmux-windows-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    runs-on: windows-latest
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: cmux-windows-win-x64
          path: dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "cmux windows ${GITHUB_REF_NAME}" --generate-notes
